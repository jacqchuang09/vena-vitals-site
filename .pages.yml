# Pages CMS forms for the existing content JSON files.
# Save on an editing branch and review a PR before merging to main.
# Clinical, regulatory, partner, advisor and accuracy claims require team approval.
# Keep EDIT NEEDED markers until the team confirms them.
settings:
  content:
    merge: true
